[project]
name = "cron"
version = "0.1.0"
description = "Cron jobs for syncing replay data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiometer>=1.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "dt-db",
    "dt-parser",
    "dt-scraper",
    "dt-logger",
    "pydantic-settings>=2.12.0",
]

[tool.uv.sources]
dt-db = { workspace = true }
dt-parser = { workspace = true }
dt-scraper = { workspace = true }
dt-logger = { workspace = true }

