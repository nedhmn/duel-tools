[project]
name = "cron"
version = "0.1.0"
description = "Cron jobs for syncing replay data"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiometer>=1.0.0",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "db",
    "parser",
    "scraper",
    "logger",
    "pydantic-settings>=2.12.0",
]


[tool.uv.sources]
db = { workspace = true }
parser = { workspace = true }
scraper = { workspace = true }
logger = { workspace = true }

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src/cron"]
