[project]
name = "scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "capsolver>=1.0.7",
    "httpx>=0.28.1",
    "logger",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]

[tool.hatch.build.targets.wheel.force-include]
"src/scraper/capsolver_task.json" = "scraper/capsolver_task.json"

[tool.uv.sources]
logger = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "ty>=0.0.4",
]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src/scraper"]
