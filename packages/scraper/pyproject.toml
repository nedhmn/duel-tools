[project]
name = "scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "capsolver>=1.0.7",
    "httpx>=0.28.1",
    "logger",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scraper"]
artifacts = ["*.json"]

[tool.uv.sources]
logger = { workspace = true }

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src/scraper"]
