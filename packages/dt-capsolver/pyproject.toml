[project]
name = "dt-capsolver"
version = "0.1.0"
description = "Capsolver wrapper for solving CAPTCHAs (Turnstile, reCAPTCHA v2)"
requires-python = ">=3.13"
dependencies = [
    "capsolver>=1.0.7",
    "dt-logger",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
dt-logger = { workspace = true }
