[project]
name = "cron"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "db",
    "parser",
    "scraper",
    "logger",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "ty>=0.0.4",
]

[tool.uv.sources]
db = { workspace = true }
parser = { workspace = true }
scraper = { workspace = true }
logger = { workspace = true }

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src/cron"]
