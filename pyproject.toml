[project]
name = "duel-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "backend",
    "cron",
    "db",
    "logger",
    "parser",
    "scraper",
    "seeder",
]

[tool.uv.workspace]
members = [
    "apps/duel-prep/backend",
    "packages/db",
    "packages/logger",
    "packages/parser",
    "packages/scraper",
    "packages/seeder",
    "packages/cron",
]

[tool.uv.sources]
backend = { workspace = true }
db = { workspace = true }
logger = { workspace = true }
parser = { workspace = true }
scraper = { workspace = true }
seeder = { workspace = true }
cron = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
    "ty>=0.0.4",
]

[tool.uv]
cache-dir = ".cache"
