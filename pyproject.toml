[project]
name = "duel-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "api",
    "cron",
    "db",
    "dt-capsolver",
    "logger",
    "parser",
    "scraper",
    "seeder",
]

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/db",
    "packages/logger",
    "packages/parser",
    "packages/scraper",
    "packages/seeder",
    "apps/cron",
    "packages/dt-capsolver",
]

[tool.uv.sources]
api = { workspace = true }
db = { workspace = true }
logger = { workspace = true }
parser = { workspace = true }
scraper = { workspace = true }
seeder = { workspace = true }
cron = { workspace = true }
dt-capsolver = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.14.10",
    "ty>=0.0.4",
]

[tool.uv]
cache-dir = ".cache"

[tool.ty.src]
exclude = [".cache", "**/tests"]
